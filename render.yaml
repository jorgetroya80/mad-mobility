# Render Blueprint: the API runs the image published by publish-api, the web serves the
# web-dist.tar.gz attached by publish-web. Render never builds either one.
# Deploys are triggered by deploy hooks from release.yml (deploy-api, deploy-web).
services:
  - type: web
    name: mad-transit-api
    runtime: image
    image:
      # deploy-api pins each release through the hook's imgURL; the Blueprint keeps
      # latest (publish-api pushes it with every release) so a sync never rolls back to an old tag
      url: ghcr.io/jorgetroya80/mad-transit-api:latest
    plan: free
    # Closest region to Madrid; it cannot be changed after the service is created
    region: frankfurt
    healthCheckPath: /health/ready
    envVars:
      # Replaces the image's JAVA_TOOL_OPTIONS on the free instance (512 MB, 0.1 CPU): a smaller
      # heap leaves room for metaspace and threads, and C1 only (tier 1) starts Spring faster
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:TieredStopAtLevel=1 -Xss512k
      # Registered MobilityLabs app (preferred), or the account email and password until it is
      # approved. Filled once in the Render dashboard, never here.
      - key: EMT_CLIENT_ID
        sync: false
      - key: EMT_PASS_KEY
        sync: false
      - key: EMT_EMAIL
        sync: false
      - key: EMT_PASSWORD
        sync: false
      # The web calls the API directly from its own origin
      - key: CORS_ALLOWED_ORIGINS
        value: https://mad-transit-web.onrender.com

  - type: web
    name: mad-transit-web
    runtime: static
    buildCommand: ./scripts/render-web-build.sh
    staticPublishPath: ./dist
    # Only deploy-web deploys: a commit to main does not change the web release
    autoDeployTrigger: 'off'
    envVars:
      # Render runs pnpm install by default, which needs a GitHub Packages token (401 without it);
      # the build command only downloads the release, so it installs nothing
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    routes:
      # Single-page app: any other path that is not a file serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite puts a content hash in every asset name
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Browsers ask for /, not /index.html
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
