spring:
  application:
    name: mad-transit-api
  config:
    import:
      # Local secrets (KEY=VALUE), ignored by git; see .env.example
      - optional:file:.env.local[.properties]
      # build.version and friends, written by Gradle (bootBuildInfo)
      - optional:classpath:META-INF/build-info.properties
  threads:
    virtual:
      enabled: true
  modulith:
    # Modules are shared and each modules/<name>, marked with @ApplicationModule + @PackageInfo
    detection-strategy: explicitly-annotated

logging:
  structured:
    format:
      console: ecs

# OpenAPI document and Swagger UI: springdoc is only on the classpath in bootRun and tests, so
# production ignores this block (/v3/api-docs and /swagger-ui.html answer 404 there)
springdoc:
  paths-to-match: /v1/**
  # Query objects such as StationsQuery are documented as one parameter per property
  default-flat-param-object: true
  default-produces-media-type: application/json
  # Nullable response properties are omitted (@JsonInclude NON_NULL), never null: keep their plain type
  model-converters:
    kotlin-nullable-property-customizer:
      enabled: false
  open-api:
    info:
      title: Mad Transit API
      version: ${build.version}
      description: >-
        Real-time BiciMAD stations in Madrid, nearest first and ranked by what you need (a bike or a free dock).
        Powered by [EMT de Madrid](https://www.emtmadrid.es) through its MobilityLabs open data platform.
      license:
        name: MIT
        url: https://opensource.org/licenses/MIT
    # Same origin as the document: the API runs wherever it is deployed
    servers:
      - url: /

mad-transit:
  emt:
    base-url: ${EMT_BASE_URL:https://openapi.emtmadrid.es}
    email: ${EMT_EMAIL:}
    password: ${EMT_PASSWORD:}
    client-id: ${EMT_CLIENT_ID:}
    pass-key: ${EMT_PASS_KEY:}
  cache:
    # Defaults for every module; override with cache.modules.<module>.ttl / max-stale
    ttl: 60s
    max-stale: 24h
    modules:
      # Bus stop list and line catalog change rarely: refreshed once a day, served stale for a week
      bus-stops:
        ttl: 24h
        max-stale: 7d
      bus-lines:
        ttl: 24h
        max-stale: 7d
  quota:
    # EMT allows 20,000 calls/day; keep a margin. Per-module caps: quota.modules.<module>.daily-limit
    global-daily-limit: 18000
    modules:
      # One stations call per cache TTL (60 s) is ~1,440/day; twice that as margin
      bicimad:
        daily-limit: 3000
      # One call per cache TTL (24 h) is 1/day each; 50 leaves room for restarts, which empty the cache
      bus-stops:
        daily-limit: 50
      bus-lines:
        daily-limit: 50
  rate-limit:
    # Per-IP token bucket on /v1/**: bursts of up to capacity, then refill-per-second requests/s
    capacity: 60
    refill-per-second: 1
  cors:
    # Comma-separated list, e.g. https://bicimad.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

resilience4j:
  retry:
    instances:
      emt:
        # 1 retry after 500 ms, only for transport failures (timeout, I/O, 5xx)
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - io.github.jorgetroya80.madtransit.shared.emt.EmtUnavailable

management:
  endpoints:
    web:
      # Serves /health, /health/live, /health/ready and /info
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      # Built-in liveness/readiness groups replaced by live/ready below
      probes:
        enabled: false
      # Components and details are safe to expose: the emt component never includes secrets
      show-details: always
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
  health:
    diskspace:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Human-readable logs for local development: --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ''
