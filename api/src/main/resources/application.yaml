spring:
  application:
    name: mad-mobility-api
  config:
    # Local secrets (KEY=VALUE), ignored by git; see .env.example
    import: optional:file:.env.local[.properties]
  threads:
    virtual:
      enabled: true
  modulith:
    # Modules are shared and each modules/<name>, marked with @ApplicationModule + @PackageInfo
    detection-strategy: explicitly-annotated

logging:
  structured:
    format:
      console: ecs

mad-mobility:
  emt:
    base-url: ${EMT_BASE_URL:https://openapi.emtmadrid.es}
    email: ${EMT_EMAIL:}
    password: ${EMT_PASSWORD:}
    client-id: ${EMT_CLIENT_ID:}
    pass-key: ${EMT_PASS_KEY:}
  cache:
    # Defaults for every module; override with cache.modules.<module>.ttl / max-stale
    ttl: 60s
    max-stale: 24h
  quota:
    # EMT allows 20,000 calls/day; keep a margin. Per-module caps: quota.modules.<module>.daily-limit
    global-daily-limit: 18000
  cors:
    # Comma-separated list, e.g. https://bicimad.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

resilience4j:
  retry:
    instances:
      emt:
        # 1 retry after 500 ms, only for transport failures (timeout, I/O, 5xx)
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - io.github.jorgetroya80.madmobility.shared.emt.EmtUnavailable
  circuitbreaker:
    instances:
      emt:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # Only transport failures open the circuit; protocol/auth errors do not
        record-exceptions:
          - io.github.jorgetroya80.madmobility.shared.emt.EmtUnavailable

management:
  endpoints:
    web:
      # Serves /health, /health/live, /health/ready and /info
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      # Built-in liveness/readiness groups replaced by live/ready below
      probes:
        enabled: false
      # Components and details are safe to expose: the emt component never includes secrets
      show-details: always
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
  health:
    diskspace:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Human-readable logs for local development: --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ''
