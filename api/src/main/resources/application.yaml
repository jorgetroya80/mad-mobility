spring:
  application:
    name: mad-mobility-api
  config:
    # Local secrets (KEY=VALUE), ignored by git; see .env.example
    import: optional:file:.env.local[.properties]
  threads:
    virtual:
      enabled: true
  modulith:
    # Modules are shared and each modules/<name>, marked with @ApplicationModule + @PackageInfo
    detection-strategy: explicitly-annotated

logging:
  structured:
    format:
      console: ecs

mad-mobility:
  cors:
    # Comma-separated list, e.g. https://bicimad.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      # Serves /health, /health/live, /health/ready and /info
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      # Built-in liveness/readiness groups replaced by live/ready below
      probes:
        enabled: false
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Human-readable logs for local development: --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ''
