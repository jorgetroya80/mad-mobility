name: CI

on:
  pull_request:
    # "edited": a manual edit re-runs CI on release-please PRs created with GITHUB_TOKEN,
    # and a title change re-runs pr-title and release-scope
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' && steps.exists.outputs.api == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' && steps.exists.outputs.web == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows }}
      tooling: ${{ steps.filter.outputs.tooling }}
      api-folder: ${{ steps.filter.outputs.api-folder }}
      web-folder: ${{ steps.filter.outputs.web-folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'api/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            workflows:
              - '.github/workflows/**'
            tooling:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '*.config.mjs'
            # Folders release-please maps to a component (release-scope job)
            api-folder:
              - 'api/**'
            web-folder:
              - 'web/**'
      - id: exists
        name: Check which projects exist
        run: |
          {
            echo "api=$([ -f api/build.gradle.kts ] && echo true || echo false)"
            echo "web=$([ -f web/tsconfig.json ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  api:
    name: API (Gradle)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base, for the changed-line coverage
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build
      # Warn only (CONSTRAINTS.md): reports the coverage of the changed lines, never fails the job
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        working-directory: .
        run: node scripts/changed-coverage.mjs --base "$BASE" --part api
      - run: ./gradlew generateOpenApi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jorgetroya80'
      - run: npx --yes @redocly/cli@2 lint build/openapi/bicimad.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @jorgetroya80/bicimad-client run generate
      - run: pnpm --filter @jorgetroya80/bicimad-client run build

  web:
    name: Web (pnpm)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base, for the changed-line coverage
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jorgetroya80'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter web run lint
      - run: pnpm --filter web run typecheck
      - run: pnpm --filter web run test:coverage
      # Warn only (CONSTRAINTS.md): reports the coverage of the changed lines, never fails the job
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/changed-coverage.mjs --base "$BASE" --part web
      - name: Layer boundaries (dependency-cruiser)
        continue-on-error: true
        run: pnpm --filter web run depcruise
      - run: pnpm --filter web run build

  tooling:
    name: Root tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jorgetroya80'
      # Enforces lockfile policies from pnpm-workspace.yaml (e.g. minimumReleaseAge)
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with commitlint.config.mjs
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            api
            web
            ci
            deps
            docs
            repo
          requireScope: false

  # release-please gives a squash commit to every component whose folder it touches, so a
  # releasing PR that also touches the other component releases it too (PR #43 bumped api).
  release-scope:
    name: release-scope
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a releasing PR touches both api/ and web/
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TOUCHES_API: ${{ needs.changes.outputs.api-folder }}
          TOUCHES_WEB: ${{ needs.changes.outputs.web-folder }}
        run: |
          releasing='^((feat|fix|perf)(\([^)]*\))?!?|[a-z]+(\([^)]*\))?!):'
          if [[ "$TITLE" =~ $releasing && "$TOUCHES_API" == true && "$TOUCHES_WEB" == true ]]; then
            echo "::error::A feat, fix, perf or breaking PR must touch only api/ or web/. Move the other component's changes to a separate build or chore PR."
            exit 1
          fi
          echo "Release scope OK."

  # Warn only (CONSTRAINTS.md): findings show in the log, but the job never blocks the merge.
  constraints:
    name: constraints (warn)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Floor guard
        run: node scripts/floor-guard.mjs --base "$BASE"
      - name: Secrets (gitleaks)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --redact --no-banner --log-opts="$BASE..HEAD" .
      - name: Code (Semgrep)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error
          --metrics=off --quiet --exclude node_modules --exclude api/build --exclude dist .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc
      - name: Dependencies (pnpm audit, production)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  ci-ok:
    name: ci-ok
    needs: [changes, api, web, tooling, workflows, pr-title, release-scope]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed or were cancelled."
          exit 1
      - run: echo "All jobs passed or were skipped."
