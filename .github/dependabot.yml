# Dependabot is enabled from the repository settings (alerts and security updates).
# This file only sets commit prefixes so security PRs pass commitlint and pr-title.
# open-pull-requests-limit: 0 disables scheduled version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci(deps)
